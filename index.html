<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="description" content="一盒日子：一颗巧克力，一段小日子。纯白手绘风互动日历 Demo。" />
<title>一盒日子 · A Box of Days</title>
<link rel="stylesheet" href="./styles.css" />
<script defer src="./app.js"></script>
</head>
<body>
<div class="site-aside left-aside" aria-hidden="true"><span class="aside-micro">A BOX OF DAYS</span><div class="aside-mark">little things<br />are big things.</div><img src="./assets/motif-flower.png" alt="" /></div>
<div class="phone-stage">
  <div class="phone-device" id="phoneDevice">
    <div class="phone-screen" id="phoneScreen">
      <div class="phone-status-bar" aria-hidden="true"><span>9:41</span><span class="status-signals"><i></i><i></i><i></i><b>▰</b></span></div>
      <button type="button" id="dayIsland" class="day-island" data-mode="idle" aria-label="一盒日子状态：休息中" aria-expanded="false" aria-controls="islandDetail">
        <span class="island-mark-wrap" aria-hidden="true"><span id="islandMark" class="island-mark">✿</span><span id="islandMoodDot" class="island-mood-dot"></span></span>
        <span class="island-copy" id="islandDetail"><span id="islandTitle" class="island-title">一盒日子</span><span id="islandSubtitle" class="island-subtitle">慢慢打开今天</span></span>
        <span id="islandMeter" class="island-meter" role="progressbar" aria-label="拆纸进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="islandProgressFill"></span></span>
        <span class="island-spark" aria-hidden="true">✦</span>
      </button>
      <span id="islandAnnouncement" class="island-announcement" aria-live="polite" aria-atomic="true"></span>
      <div class="phone-app-scroll" id="phoneAppScroll">
        <div class="app-shell" id="app">
          <header class="masthead">
            <button type="button" class="brand" data-nav="calendar" aria-label="回到盒历"><span class="brand-wordmark">一盒日子</span><span class="brand-sub">A Box of Days <span aria-hidden="true">✳</span></span></button>
            <button type="button" class="month-entry" data-months aria-label="选择月份"><span id="monthIndex">11 / 12</span><span class="month-down" aria-hidden="true">⌄</span></button>
          </header>
          <main id="pageContent" tabindex="-1"></main>
          <nav class="bottom-nav" aria-label="主导航">
            <button type="button" class="nav-item active" data-nav="calendar" aria-current="page"><svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M6 10L13 6L20 10L29 7L29 28L21 31L13 27L6 30Z M13 6v21m8-17v21" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M18 17l3-3 3 3-3 4Z" stroke="currentColor" stroke-width="1.3"/></svg><span>盒历</span></button>
            <button type="button" class="nav-item" data-nav="anticipation"><svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M7 15c3-7 6-2 11 2 5-4 9-8 12-2 0 8-8 8-12 2C14 24 6 24 7 15Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="m12 10-2-3m13 19 2 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>小小期待</span></button>
            <button type="button" class="nav-item" data-nav="memories"><svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M6 9Q12 6 18 10Q24 6 30 9V29Q24 25 18 29Q12 25 6 29Z M18 10v19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 15q2-2 4 0m8 1q2-2 4 0" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg><span>回味</span></button>
          </nav>
        </div>
      </div>
      <div class="overlay-root" id="overlayRoot" aria-live="polite"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
  <div class="stage-caption"><span class="caption-flower">✿</span><span>A LITTLE TREAT, RIGHT ON TIME</span><span class="caption-dot">·</span><span>一颗巧克力，一段小日子</span></div>
</div>
<div class="site-aside right-aside" aria-hidden="true"><img src="./assets/motif-cloud.png" alt="" /><div>one chocolate<br />at a time <span>✧</span></div><span class="aside-micro">HAND-DRAWN LITTLE WORLDS</span></div>
</body>
</html>
